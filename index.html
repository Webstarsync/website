<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webstar Sync — Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1a1d25 0%, #0a0b10 58%);
        color: #eceff4;
      }

      main {
        width: min(92vw, 680px);
        padding: 3rem 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(5px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      p {
        margin: 0 auto;
        max-width: 42ch;
        font-size: clamp(1rem, 2.2vw, 1.15rem);
        line-height: 1.6;
        color: #bfc7d6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming Soon</h1>
      <p>Webflow plugin for syncing Google Reviews data into CMS.</p>
    </main>
  </body>
</html>
